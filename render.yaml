services:
  - type: web
    name: neargram
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: ""
    startCommand: python server.py
    healthCheckPath: /
    autoDeploy: true
    pythonVersion: 3.12.4
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: neargram-db
          property: internalConnectionString
      - key: PYTHON_VERSION
        value: 3.12.4
  - type: one-off-job
    name: seed-bots
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: ""
    startCommand: python generate_bots.py --count 120 --password botpass
    pythonVersion: 3.12.4
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: neargram-db
          property: internalConnectionString

databases:
  - name: neargram-db
    plan: free
    databaseName: neargram
    user: neargram